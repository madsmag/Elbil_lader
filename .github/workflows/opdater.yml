name: Opdater prognose og tariffer

on:
  schedule:
    # UTC. Dagens priser for i morgen offentliggøres ca. kl. 13 dansk tid.
    - cron: "15 4 * * *"
    - cron: "15 12 * * *"
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opdater
  cancel-in-progress: false

jobs:
  opdater:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer pakker
        run: pip install -r requirements.txt

      - name: Byg prognose og hent tariffer
        run: python elbil_lader.py --eksport docs/data --refresh

      - name: Gem ændringer
        run: |
          git config user.name "elbil-lader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Ingen ændringer"
          else
            git commit -m "Opdater prognose og tariffer"
            git push
          fi
